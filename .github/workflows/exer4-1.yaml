name: Incident Switchboard

run-name: >-
  Incident Switchboard |
  ${{ inputs.severity && format('{0}{1}', inputs.severity, inputs.deep_scan && ' SCAN' || '') || 'AUTOMATIC' }}

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      severity:
        description: "Incident severity"
        type: choice
        options:
          - low
          - medium
          - high
        default: low
        required: true

      deep_scan:
        description: "Request a deep scan"
        type: boolean
        default: false
        required: true

      skip_tests:
        description: "Skip tests"
        type: boolean
        default: false
        required: true

      reason:
        description: "Reason for the incident run"
        type: string
        required: false

jobs:
  Triage:
    name: triage
    runs-on: ubuntu-latest
    steps:
      - name: print start-up information
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Actor: ${{ github.actor }}"
          echo "Run number: ${{ github.run_number }}"

      - name: print anual run information
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Severity: ${{ inputs.severity }}"
          echo "Deep scan: ${{ inputs.deep_scan && 'ON' || 'OFF' }}"
          echo "Skip tests: ${{ inputs.skip_tests && 'ON' || 'OFF' }}"
          echo "Reason: ${{ inputs.reason || 'N/A' }}"

      - name: print automatic run information
        if: github.event_name != 'workflow_dispatch'
        run: |
          echo "This run was automatic and no reason was supplied."
        
      - name: low severity
        if: inputs.severity == 'low'
        run: |
          echo "This is a low severity incident. Minimal action required."

